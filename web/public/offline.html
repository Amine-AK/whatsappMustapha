<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ما كاينش الأنترنيت</title>
<style>
  :root { color-scheme: light dark; --bg: #f3f5f4; --fg: #16201c; --muted: #5b6a64; --accent: #0b5d46; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1714; --fg: #e4ece8; --muted: #9aaba4; --accent: #4cc39a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font-family: "IBM Plex Sans Arabic", Tahoma, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: var(--muted); margin: 0 0 20px; }
  button { font: inherit; padding: 12px 24px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
</style>
</head>
<body>
  <main>
    <h1>ما كاينش الأنترنيت</h1>
    <p>الزبناء كيتجابو من الـ Google Sheet، خاص الأنترنيت باش تشوفهم.</p>
    <button type="button" onclick="location.reload()">عاود</button>
  </main>
</body>
</html>
